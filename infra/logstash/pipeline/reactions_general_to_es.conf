input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/postgresql.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/${JDBC_DB}"
    jdbc_user => "${JDBC_USER}"
    jdbc_password => "${JDBC_PASSWORD}"

    schedule => "*/10 * * * * *"
    use_column_value => true                      # использовать id как offset
    tracking_column => "id"
    tracking_column_type => "numeric"
    clean_run => false
    last_run_metadata_path => "/usr/share/logstash/state/reactions_general.yml"

    statement => "
      SELECT *,
      to_char(date, 'YYYY-MM') as index_month
      FROM base_data.reactions_general
      WHERE id > :sql_last_value
      AND date >= NOW() - INTERVAL '2 months'
      ORDER BY id
      LIMIT 100000
    "
  }
}


filter {
 mutate {
    add_field => { "[@metadata][index_month]" => "%{index_month}" }
 }

 mutate {
    remove_field => ["@timestamp", "@version", "index_month"]
 }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "reactions_general-%{[@metadata][index_month]}"
	
    document_id => "%{id}"
    #user => "elastic"
    #password => "0FruBD8UmKI_AoO3Izmv"
    #ssl_enabled => true
    #ssl_certificate_authorities => "/etc/logstash/certs/elasticsearch-ca.pem"
  }

  #stdout { codec => plain }
}
