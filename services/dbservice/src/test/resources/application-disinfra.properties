#-----------------------------Postgres-----------------------------
postgres.enabled=false
spring.data.jdbc.repositories.enabled=false
spring.data.r2dbc.repositories.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
#-----------------------------Kafka-----------------------------
spring.kafka.listener.auto-startup=false

kafka.enabled=false

kafka.notifications.send.topic.name=gui_notifications
kafka.heartbeat.topic.name=service-heartbeat

#-----------------------------ES-----------------------------
es.enabled=false
spring.data.elasticsearch.repositories.enabled=false