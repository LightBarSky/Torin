#-----------------------------Project Setting-----------------------------
spring.application.name=dbService
server.port = 9090
#-----------------------------JDBC-----------------------------
spring.datasource.jdbc-url=jdbc:postgresql://localhost:5432/test
spring.datasource.username=user
spring.datasource.password=pass

spring.datasource.maximum-pool-size=50

kafka-to-db.delay-user-update-days=3
#-----------------------------R2DBC-----------------------------
r2dbc.host=localhost
r2dbc.port=5432
r2dbc.db_name=test
r2dbc.driver=postgresql
r2dbc.username=user
r2dbc.password=pass
logging.level.io.r2dbc.postgresql=DEBUG
logging.level.io.r2dbc.spi=DEBUG
#-----------------------------FlyWay-----------------------------
spring.flyway.enabled=true

spring.flyway.default-schema=flyway
#logging.level.org.flywaydb=DEBUG
#-----------------------------Kafka-----------------------------
spring.kafka.listener.auto-startup=false

kafka.enabled=false

kafka.notifications.send.topic.name=gui_notifications
kafka.heartbeat.topic.name=service-heartbeat

#-----------------------------ES-----------------------------
es.enabled=false
spring.data.elasticsearch.repositories.enabled=false