name: TelegramService CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/telegramservice/**'
  pull_request:
    paths:
      - 'services/telegramservice/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/telegramservice
        
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Publish
        run: dotnet publish Torin.Api/Torin.Api.csproj -c Release -o out

      - name: Docker build
        run: docker build -t torin-telegramservice:latest .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-service
          path: services/telegramservice/out/**